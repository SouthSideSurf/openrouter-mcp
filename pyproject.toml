[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-mcp"
version = "0.1.0"
description = "A tiny MCP stdio server that exposes OpenRouter models as Claude Code tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SouthSideSurf" }]
keywords = ["mcp", "openrouter", "claude", "llm", "ai-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["openai>=1.0"]

[project.urls]
Homepage = "https://github.com/SouthSideSurf/openrouter-mcp"
Issues = "https://github.com/SouthSideSurf/openrouter-mcp/issues"

[project.scripts]
openrouter-mcp-server = "openrouter_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
